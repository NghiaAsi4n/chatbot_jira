[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chatbot-jira"
version = "0.1.0"
description = "Chatbot that creates Jira tickets via Atlassian Rovo MCP"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "httpx2==2.13.1",
  "jsonschema==4.26.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.54,<1",
  "python-multipart>=0.0.32,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_jira"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
